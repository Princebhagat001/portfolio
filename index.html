    <script>
      (() => {
        // Keep these thresholds in sync with chooseQuality() in src/utilis/worldQuality.js.
        try {
          const cores = Number.isFinite(navigator.hardwareConcurrency)
            ? navigator.hardwareConcurrency
            : undefined;
          const reportedMemory = Number.isFinite(navigator.deviceMemory)
            ? navigator.deviceMemory
            : undefined;
          // Chromium caps this hint at 8 GB, so 8 cannot distinguish higher tiers.
          const memory = reportedMemory === 8 ? undefined : reportedMemory;
          const saveData = Boolean(navigator.connection?.saveData);
          const low = saveData || (cores !== undefined && cores <= 4) || (memory !== undefined && memory <= 4)
            || (cores === undefined && memory === undefined);
          const medium = !low && ((cores !== undefined && cores <= 8) || (memory !== undefined && memory <= 12));
          document.documentElement.dataset.galaxyQuality = low ? 'low' : medium ? 'medium' : 'high';
        } catch {
          document.documentElement.dataset.galaxyQuality = 'low';
        }
      })();
    </script>
